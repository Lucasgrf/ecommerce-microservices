name: CI - Build and Test

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Test all services even if one fails
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service
          - notification-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          ./mvnw clean verify
        # Testcontainers requires Docker, which is available on ubuntu-latest
