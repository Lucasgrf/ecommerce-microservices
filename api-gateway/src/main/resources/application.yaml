server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/user/**, /api/v1/auth/**, /v3/api-docs/**, /swagger-ui/**, /api-docs/**
            
        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
