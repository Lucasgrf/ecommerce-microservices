server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /v3/api-docs/**, /swagger-ui/**, /api-docs/**
            
        - id: user-service-secure-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/user/**
          filters:
            - JwtAuthentication

        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
            
        - id: order-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - JwtAuthentication

        - id: notification-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - JwtAuthentication

security:
  jwt:
    secret-key: "mySecretKeyMySecretKeyMySecretKeyMySecretKey"
